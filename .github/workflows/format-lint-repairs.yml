name: Format Lint Repairs

on:
  push:
    branches:
      - agent/project-documentation-audit

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: agent/project-documentation-audit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format repaired files
        run: |
          npx prettier --write \
            src/hooks/useDisk.ts \
            src/main.tsx \
            src/components/NavigationDrawer.tsx \
            src/components/integrated-storage/PoolsTable.tsx \
            src/components/integrated-storage/SelectedPoolsDetailsPanel.tsx \
            src/components/share/ManageShareMembersModal.tsx \
            src/components/users/OsUsersTable.tsx \
            src/pages/FileSystem.tsx

      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/hooks/useDisk.ts \
            src/main.tsx \
            src/components/NavigationDrawer.tsx \
            src/components/integrated-storage/PoolsTable.tsx \
            src/components/integrated-storage/SelectedPoolsDetailsPanel.tsx \
            src/components/share/ManageShareMembersModal.tsx \
            src/components/users/OsUsersTable.tsx \
            src/pages/FileSystem.tsx
          git commit -m "style: format final lint repairs"
          git push origin HEAD:agent/project-documentation-audit
