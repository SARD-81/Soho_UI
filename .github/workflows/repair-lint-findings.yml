name: Repair Lint Findings

on:
  push:
    branches:
      - agent/project-documentation-audit

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: agent/project-documentation-audit

      - name: Apply lint repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def load(path_str: str):
              path = Path(path_str)
              return path, path.read_text(encoding='utf-8')

          def save(path: Path, before: str, after: str):
              if after != before:
                  path.write_text(after, encoding='utf-8')
                  print(f'updated {path}')
              else:
                  print(f'no change {path}')

          path, text = load('src/hooks/useDisk.ts')
          updated = text.replace(
              'return !Boolean(data.data?.has_partitions);',
              'return !data.data?.has_partitions;',
              1,
          )
          save(path, text, updated)

          path, text = load('src/main.tsx')
          updated = text.replace('  let client: QueryClient;\n\n', '', 1)
          updated = updated.replace(
              '  client = new QueryClient({',
              '  const client = new QueryClient({',
              1,
          )
          save(path, text, updated)

          path, text = load('src/components/integrated-storage/PoolsTable.tsx')
          updated = text.replace(
              '      onDelete,\n      onEdit,\n      onAddDevices,',
              '      onDelete,\n      onAddDevices,',
              1,
          )
          save(path, text, updated)

          path, text = load(
              'src/components/integrated-storage/SelectedPoolsDetailsPanel.tsx'
          )
          updated = re.sub(
              r"  const attributeSort = useMemo\(\s*\(\) =>\s*createPriorityAwareComparatorFromRecords\(\s*comparisonValues,\s*'fa-IR',\s*comparisonPriority\s*\),\s*\[comparisonPriority, comparisonValues\]\s*\);",
              """  const attributeSort = createPriorityAwareComparatorFromRecords(
            comparisonValues,
            'fa-IR',
            comparisonPriority
          );""",
              text,
              count=1,
              flags=re.S,
          )
          save(path, text, updated)

          path, text = load('src/components/share/ManageShareMembersModal.tsx')
          updated = text.replace(
              '  const currentAccessMembers = membersQuery.data ?? [];',
              """  const currentAccessMembers = useMemo(
            () => membersQuery.data ?? [],
            [membersQuery.data]
          );""",
              1,
          )
          save(path, text, updated)

          path, text = load('src/components/users/OsUsersTable.tsx')
          updated = re.sub(
              r"const OsUsersTable = \(\{\s*users,\s*isLoading,\s*error,\s*isSambaStatusLoading,\s*onCreateSambaUser,\s*\}: OsUsersTableProps\) => \{",
              """const OsUsersTable = ({
            users,
            isLoading,
            error,
          }: OsUsersTableProps) => {""",
              text,
              count=1,
              flags=re.S,
          )
          updated = updated.replace(
              '    [isSambaStatusLoading, onCreateSambaUser]\n',
              '    []\n',
              1,
          )
          save(path, text, updated)

          path, text = load('src/pages/FileSystem.tsx')
          updated = re.sub(
              r"  const filesystemEntries = data\?\.filesystems \?\? \[\];\s*const filesystems = useMemo\(\s*\(\) =>\s*\[\.\.\.filesystemEntries\]\.sort\(\(a, b\) =>\s*a\.filesystemName\.localeCompare\(b\.filesystemName, 'en', \{\s*sensitivity: 'base',\s*\}\)\s*\),\s*\[filesystemEntries\]\s*\);",
              """  const filesystems = useMemo(
            () =>
              [...(data?.filesystems ?? [])].sort((a, b) =>
                a.filesystemName.localeCompare(b.filesystemName, 'en', {
                  sensitivity: 'base',
                })
              ),
            [data?.filesystems]
          );""",
              text,
              count=1,
              flags=re.S,
          )
          save(path, text, updated)

          path, text = load('src/components/NavigationDrawer.tsx')
          updated = re.sub(
              r"  const isItemActive = \(item: NavigationItem\): boolean => \{\s*const matchesCurrentPath =\s*location\.pathname === item\.path \|\|\s*location\.pathname\.startsWith\(`\$\{item\.path\}/`\);\s*return \(\s*matchesCurrentPath \|\|\s*\(item\.children\?\.some\(\(child\) => isItemActive\(child\)\) \?\? false\)\s*\);\s*\};",
              """  const isItemActive = React.useCallback(
            (item: NavigationItem): boolean => {
              const checkItemActive = (currentItem: NavigationItem): boolean => {
                const matchesCurrentPath =
                  location.pathname === currentItem.path ||
                  location.pathname.startsWith(`${currentItem.path}/`);

                return (
                  matchesCurrentPath ||
                  (currentItem.children?.some(checkItemActive) ?? false)
                );
              };

              return checkItemActive(item);
            },
            [location.pathname]
          );""",
              text,
              count=1,
              flags=re.S,
          )
          updated = updated.replace(
              '}, [location.pathname]);',
              '  }, [isItemActive]);',
              1,
          )
          updated = updated.replace(
              '          const itemKey = getItemKey(item); // استفاده از تابع getItemKey',
              '          const itemKey = getItemKey(item);',
              1,
          )
          updated = updated.replace(
              '    return item.path || item.text; // اگر path وجود داشت از آن استفاده کن، در غیر این صورت از text',
              '    return item.path || item.text;',
              1,
          )
          save(path, text, updated)
          PY

      - name: Commit repairs when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/hooks/useDisk.ts \
            src/main.tsx \
            src/components/NavigationDrawer.tsx \
            src/components/integrated-storage/PoolsTable.tsx \
            src/components/integrated-storage/SelectedPoolsDetailsPanel.tsx \
            src/components/share/ManageShareMembersModal.tsx \
            src/components/users/OsUsersTable.tsx \
            src/pages/FileSystem.tsx
          git commit -m "fix: resolve frontend lint findings"
          git push origin HEAD:agent/project-documentation-audit
